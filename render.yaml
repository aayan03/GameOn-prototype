# Render blueprint. Import the repo and Render reads this.
# The database is Atlas — see DEPLOY.md.
services:
  - type: web
    name: gameon-api
    runtime: node
    rootDir: backend
    # `free` costs nothing but spins down after 15 minutes idle (~1 min cold
    # start) and is capped at 750 instance-hours per workspace per month.
    # `starter` is the paid tier that stays warm.
    plan: free
    # `npm ci` needs a committed package-lock.json. Falling back to `npm
    # install` means a fresh clone of this repo deploys without one.
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: combined
      # generateValue creates a strong secret once and keeps it.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # These must be set by hand — Render cannot invent them.
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Shared secret for the external scheduler that runs the lifecycle job.
      # Leave it unset and POST /api/cron/lifecycle 404s.
      - key: CRON_SECRET
        generateValue: true
      # Email is REQUIRED in production - the server refuses to boot without
      # it, because password reset is the only way back into a locked-out
      # account.
      #
      # Use BREVO_API_KEY, not SMTP: Render's free tier blocks outbound SMTP
      # ports, so an SMTP transport times out at send time even though the
      # credentials are perfectly valid.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Public URL of the frontend, used to build reset links.
      - key: APP_URL
        sync: false
      # Optional. Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional but strongly recommended — without it, production errors
      # only ever reach the log stream.
      - key: SENTRY_DSN
        sync: false
      # The simulated top-up mints balance from nothing. Never true on a
      # deployment taking real bookings.
      - key: ALLOW_SIMULATED_TOPUP
        value: "false"
