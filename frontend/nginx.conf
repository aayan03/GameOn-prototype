server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Bodies are capped at 256 KB by the API; reject larger ones at the edge.
  client_max_body_size 512k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # `text/javascript` as well as `application/javascript`: nginx has mapped
  # .js to text/javascript since 1.21.1, and this image pins 1.27 — so the
  # Vite bundles, the single biggest download, were being served uncompressed.
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

  include /etc/nginx/snippets/security-headers.conf;

  # ── The API ────────────────────────────────────────────────
  # Without this the compose stack was broken end to end: the frontend was
  # built with an empty VITE_API_URL, which means "same origin", and nothing
  # here answered /api. Every request 404'd as an SPA fallback and came back
  # as HTML the client tried to parse as JSON.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS, with the target in a variable so nginx resolves
    # it per-request rather than once at startup. A static `proxy_pass
    # http://api:5000` makes nginx refuse to start at all if the API container
    # is not yet resolvable — the whole site down because the backend is slow
    # to boot.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_origin "http://api:5000";
    proxy_pass $api_origin$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 30s;
    # The API sets its own CORS and cache policy; do not cache its answers.
    proxy_buffering off;
  }

  # ── Static assets ──────────────────────────────────────────
  # Hashed filenames never change — cache them hard.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
  }

  # The service worker must NOT be cached, or a stale one keeps serving an
  # old build forever and the update prompt never fires.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { application/manifest+json webmanifest; }
  }

  # ── SPA fallback ───────────────────────────────────────────
  # A deep link like /teamup/abc must serve index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
