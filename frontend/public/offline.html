<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — GameOn</title>
  <style>
    :root { --ink:#16162B; --volt:#D6FF3F; --bg:#FBF9F4; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:var(--bg); color:var(--ink);
      font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background-image:radial-gradient(rgba(22,22,43,.03) 1px, transparent 1px);
      background-size:22px 22px;
    }
    .card {
      max-width:420px; width:100%; text-align:center;
      background:#fff; border:3px solid var(--ink); border-radius:32px;
      padding:40px 32px; box-shadow:8px 8px 0 var(--ink);
    }
    .mark {
      width:56px; height:56px; margin:0 auto 20px; border-radius:16px;
      background:var(--volt); border:3px solid var(--ink);
      display:grid; place-items:center; font-weight:900; font-size:1rem;
      transform:rotate(-4deg);
    }
    h1 { margin:0 0 10px; font-size:1.7rem; letter-spacing:-.03em; }
    p { margin:0 0 24px; color:#55506B; line-height:1.6; }
    button {
      font:inherit; font-weight:800; cursor:pointer;
      padding:13px 26px; border-radius:99px;
      background:var(--volt); color:var(--ink);
      border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
      transition:transform .15s, box-shadow .15s;
    }
    button:active { transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">GO</div>
    <h1>You're offline</h1>
    <p>
      Your bookings and tickets are saved. Reconnect and everything will be
      here waiting — nothing has been lost.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
