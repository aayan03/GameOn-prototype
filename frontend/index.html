<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no makes the web build behave like
         a native app once it is wrapped with Capacitor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16162B" />
    <meta name="color-scheme" content="light" />

    <title>GameOn — Find. Book. Play.</title>
    <meta name="description" content="Book turfs and courts near you in seconds. Live availability, instant confirmation, and TeamUp to find the players you're missing." />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GameOn" />
    <meta property="og:title" content="GameOn — Find. Book. Play." />
    <meta property="og:description" content="Book turfs and courts near you in seconds. Short on players? TeamUp finds them." />
    <meta property="og:image" content="__SITE_URL__/icon-512.png" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GameOn — Find. Book. Play." />
    <meta name="twitter:description" content="Book turfs and courts near you in seconds." />

    <!-- PWA / iOS home screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameOn" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preconnect so the display font is not the thing users wait on -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "GameOn",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "Sports venue booking with live availability and player matchmaking.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:40px;font-family:system-ui,sans-serif;text-align:center">
        <h1>GameOn needs JavaScript</h1>
        <p>Please enable JavaScript to book a slot.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
