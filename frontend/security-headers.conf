# Security headers, in a file because nginx `add_header` does not inherit.
#
# A location block that sets ANY add_header of its own discards every
# add_header from its parent — so /assets/, /sw.js and the manifest were each
# silently dropping the entire CSP and every other header below. Including
# this file in every such block is the fix; there is no "inherit as well"
# directive.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ── Content Security Policy ───────────────────────────────────────
#
# `script-src 'self'` blocked Razorpay Checkout outright. checkout.razorpay.com
# is a third-party script that then opens its own iframe, and neither was
# allowed — so card and UPI payments failed silently on this deployment with
# `loadRazorpay()` reporting "unavailable" and no error anywhere that said why.
# A CSP that breaks the payment flow gets switched off, which is worse than
# one that names the hosts it actually needs.
#
# Every entry below is here because something real loads from it:
#   checkout.razorpay.com  the Checkout script, and the iframe it opens
#   api.razorpay.com       the 3-D Secure / bank redirect frame and form POST
#   *.razorpay.com         Checkout's own telemetry and asset hosts
#   fonts.googleapis.com   the stylesheet; fonts.gstatic.com the font files
#   tile.openstreetmap.org / basemaps.cartocdn.com   Leaflet map tiles
#
# `connect-src 'self'` is enough here because nginx proxies /api on the same
# origin. On a split deployment (Vercel + a separate API host) it needs that
# host adding — see the note in vercel.json.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://api.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://*.razorpay.com https:; connect-src 'self' https://*.razorpay.com https://lumberjack.razorpay.com https://lumberjack-metrics.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com; child-src https://api.razorpay.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com" always;
