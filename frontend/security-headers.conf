# Security headers, in a file because nginx `add_header` does not inherit.
#
# A location block that sets ANY add_header of its own discards every
# add_header from its parent — so /assets/, /sw.js and the manifest were each
# silently dropping the entire CSP and every other header below. Including
# this file in every such block is the fix; there is no "inherit as well"
# directive.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
