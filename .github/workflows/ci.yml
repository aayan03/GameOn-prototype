name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — lint, unit, integration (node ${{ matrix.node-version }}, TZ ${{ matrix.tz }})
    runs-on: ubuntu-latest
    # Both ends of what package.json engines promises. A single version hides
    # exactly the class of bug that broke this build: `node --test` takes a
    # directory on 18-21 and a glob on 22+, and the two forms throw on each
    # other's versions — so the suite passed locally on 24 and failed on 20
    # before a single test had run.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        # The venue clock is Asia/Kolkata; the server clock deliberately is
        # not. Every real host (Render, Railway, Fly, node:*-alpine) runs UTC,
        # and the whole slot layer was 5.5 hours out there while passing on a
        # developer machine set to IST. Running the suite under a mismatched
        # TZ is what makes that class of bug fail in CI rather than in
        # production.
        tz: ['UTC', 'America/Los_Angeles']
    env:
      TZ: ${{ matrix.tz }}
      APP_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        working-directory: backend
        run: npm ci || npm install

      - name: Lint
        working-directory: backend
        run: npm run lint

      # Per-file opt-in via `// @ts-check`, so this is green from the day it
      # was added and only ever gets stricter. See jsconfig.json.
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # `node --check` only parses; a module that throws while EVALUATING
      # passes every syntax check and still takes the whole API down at boot.
      # See tests/load.test.mjs.
      - name: Unit tests
        working-directory: backend
        run: npm run test:unit

      # The real gate. These boot the app against an in-memory MongoDB and
      # drive it over HTTP — the middleware chain, the validators, the indexes
      # and the controllers together. Every bug this project actually shipped
      # was in that seam, invisible to the unit tests.
      - name: Integration tests
        working-directory: backend
        run: npm run test:integration

      # One matrix leg only. Coverage instrumentation roughly doubles the wall
      # time of this suite, and the number does not differ between Node 20 and
      # 22 or between server timezones — running it on every leg would pay for
      # the same answer four times over.
      - name: Coverage floor
        if: matrix.node-version == 22 && matrix.tz == 'UTC'
        working-directory: backend
        run: npm run coverage

      - name: Boot check
        working-directory: backend
        env:
          NODE_ENV: development
          JWT_SECRET: ci_only_secret_value_at_least_32_characters
          JWT_REFRESH_SECRET: ci_only_refresh_value_at_least_32_chars
        run: |
          node src/server.js &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:5000/api/health || (kill $PID; exit 1)
          curl -sf http://localhost:5000/api/ready  || (kill $PID; exit 1)
          curl -sf http://localhost:5000/api/config || (kill $PID; exit 1)
          kill $PID

      # Proves the production guardrails actually refuse to boot. A server
      # that starts with a default JWT secret is one anybody who has read this
      # repository can mint an admin token for.
      - name: Production config guardrails
        working-directory: backend
        run: |
          set +e
          NODE_ENV=production MONGO_URI=mongodb://localhost:27017/x \
            JWT_SECRET=insecure_dev_secret JWT_REFRESH_SECRET=insecure_dev_refresh \
            CORS_ORIGINS=https://example.com \
            node -e "import('./src/config/env.js').then(m => m.validateEnv())" 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "::error::validateEnv accepted insecure production secrets"
            exit 1
          fi
          echo "Refused insecure secrets, as expected."

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The frontend had lint and a build gate but no tests at all. These
      # cover the seams that actually broke: local-vs-UTC date keys, the API
      # client's error and token-refresh paths, the route guards, and the
      # counter that must never display a wrong number.
      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check the bundle was produced
        working-directory: frontend
        run: test -f dist/index.html && test -d dist/assets

      # The bug that made every deep link render a blank page. A relative base
      # resolves the bundle against whatever path the visitor landed on, so
      # /venues/some-turf asks for /venues/assets/... and gets the SPA
      # fallback HTML, which the browser refuses to execute as a module.
      - name: Assets must be referenced absolutely
        working-directory: frontend
        run: |
          if grep -q 'src="\./assets/' dist/index.html; then
            echo "::error::dist/index.html uses relative asset paths - deep links will render a blank page. Check the base option in vite.config.js."
            exit 1
          fi
          grep -q 'src="/assets/' dist/index.html || {
            echo "::error::could not find an absolute asset reference in dist/index.html"
            exit 1
          }
          echo "Asset paths are absolute."

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gameon-api ./backend
      - run: docker build -t gameon-web ./frontend

  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    # A high-severity advisory in nodemailer — recipient-domain validation
    # bypass, which on a service that emails password-reset links is an
    # account-takeover path — sat in this repository unnoticed because nothing
    # ever ran `npm audit`. Lint and tests cannot see that class of problem at
    # all: the code is correct, the dependency underneath it is not.
    #
    # Production dependencies only. A vulnerability in a test runner or a
    # bundler is worth knowing about but does not ship, and failing every pull
    # request over one is how a team learns to ignore this job.
    #
    # The gate is `high`, and the moderates are reported without failing. That
    # split is deliberate rather than lax: both moderates open right now have
    # been assessed and neither is reachable. `qs` is pinned by Express 4 with
    # no fix inside it, and app.js takes qs out of the query path entirely by
    # setting `query parser: simple`. `react-router`'s open redirect needs a
    # navigation target that comes from a URL, and the only one in the app —
    # /login?next= — is filtered through utils/redirect.js. Blocking on those
    # would leave this job permanently red, which is worth less than a job that
    # goes red only when something new and serious lands.
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci || npm install

      - name: Fail on high or critical
        working-directory: ${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=high

      - name: Report everything else
        if: always()
        working-directory: ${{ matrix.app }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate
